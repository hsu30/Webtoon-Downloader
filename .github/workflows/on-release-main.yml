name: Validate source version

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up the environment
        uses: ./.github/actions/setup-uv-env

      - name: Check package version
        run: |
          uv run --locked python - <<'PY'
          import importlib.metadata
          import os
          from packaging.version import Version

          actual = importlib.metadata.version("webtoon_downloader")
          if os.environ.get("GITHUB_REF_TYPE") == "tag":
              expected = os.environ["GITHUB_REF_NAME"].removeprefix("v").replace("-numbertitle.", "+numbertitle.", 1)
              if Version(actual) != Version(expected):
                  raise SystemExit(f"Tag version {expected} does not match package version {actual}")
          print(f"Package version: {actual}")
          PY

      - name: Build source and wheel locally
        run: uv build
