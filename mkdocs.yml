site_name: webtoon-downloader
repo_url: https://github.com/hsu30/Webtoon-Downloader
site_description: CLI downloader for saving Webtoons series as images, ZIPs, CBZs, or PDFs.
site_author: Webtoon Downloader contributors
edit_uri: edit/master/docs/
repo_name: hsu30/Webtoon-Downloader
copyright: Original work by Ali Taibi; maintained by hsu30 under the MIT License.

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - CLI Guide: cli.md
  - Download Reliability: download-reliability.md
  - FAQ: faq.md
  - Architecture: architecture.md
  - Development: development.md
  - API Reference: modules.md
exclude_docs: |
  /download-reliability-plan.md
  /download-reliability-baseline.md
  /download-reliability-acceptance.md

plugins:
  - search
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          paths:
            - .

theme:
  name: material
  feature:
    tabs: true
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hsu30/Webtoon-Downloader

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
